spring.application.name=product-api
server.port=8000

spring.datasource.url=jdbc:postgresql://localhost/db_product
spring.datasource.username=postgres
spring.datasource.password=postgres

app.promotion.message=Christmas Promotion

#spring.profiles.active=es

spring.cloud.consul.host=localhost
spring.cloud.consul.port=8500

spring.config.import=optional:consul:


# Timeout do cliente HTTP
spring.cloud.openfeign.client.config.default.connectTimeout=2000
spring.cloud.openfeign.client.config.default.readTimeout=3000

# Resilience4j - Retry
resilience4j.retry.instances.currency-api.max-attempts=3
resilience4j.retry.instances.currency-api.wait-duration=500ms

# Resilience4j - Circuit Breaker
resilience4j.circuitbreaker.instances.currency-api.sliding-window-size=5
resilience4j.circuitbreaker.instances.currency-api.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.currency-api.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.currency-api.permitted-number-of-calls-in-half-open-state=2

# Cache
spring.cache.type=caffeine
spring.cache.cache-names=currency-api
spring.cache.caffeine.spec=maximumSize=100,expireAfterWrite=10m
